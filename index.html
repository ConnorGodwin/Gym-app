<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Forge – Workout Tracker</title>
  <meta name="description" content="Customisable workout plans, gym, running, cycling and HYROX logging, timers and progression suggestions.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <script>try{var r=document.documentElement,t=localStorage.getItem('forge.theme');if(t==='light'||t==='dark')r.dataset.theme=t;
    var a=JSON.parse(localStorage.getItem('forge.accent')||'null');if(a){var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);r.style.setProperty('--accent',d?a.dark:a.light);}}catch(e){}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Forge">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main"></main>
  <div id="restbar" hidden></div>
  <nav id="nav">
    <a href="#/train" data-tab="train"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Train</a>
    <a href="#/plans" data-tab="plans"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Plans</a>
    <a href="#/food" data-tab="food"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.2 1.2-3.5 3.6-3.5 7v3H17"/></svg>Food</a>
    <a href="#/progress" data-tab="progress"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 16v-5M11 16V7M16 16v-7M21 4l-5 5-4-3-6 5"/></svg>Progress</a>
    <a href="#/timer" data-tab="timer"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Timer</a>
  </nav>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
  <div id="update" role="status" hidden></div>
  <script src="js/exercises.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/store.js"></script>
  <script src="js/howto.js"></script>
  <script src="js/demos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/training.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/body.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
