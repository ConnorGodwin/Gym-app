# Runs Forge's automated tests on every push and pull request.
# Unit tests check the progression maths and bundled data; browser tests use every screen
# on Android and iPhone screen sizes (Open Food Facts is mocked, so no network is needed).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm run test:unit
      - name: Browser tests
        run: npx playwright test
      - name: Upload report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 14
